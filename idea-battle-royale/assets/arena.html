<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sunday Plan Battle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<!--
  Idea Battle Royale — visual mode template.

  To render a tournament: replace the JSON inside <script id="battle-data"> below
  with the tournament's data, keeping the same shape as the example. Set <title>
  to a 2-4 word name for the tournament. Everything else renders from the data.

  Fighter "out" values: "round1", "storm1", "storm2", "final" (the losing
  finalist) or null (the champion). "round1Note" is optional: use it to say
  when the judge rescored round 1 because the scores were too close. "betCheck": "plausible" | "uncertain" |
  "doubtful". Storm "verdict": "bends" | "breaks". Bet "risk": "high" | "medium"
  | "low". Leave "storms" empty for --quick.

  For another language, set "lang" and fill "labels" with any of the keys of
  LABELS in the script at the bottom (the values given there are the English
  defaults).
-->
<style>
/* Layout: a verdict-first fight card. The super idea opens the page; the rounds follow as the record of how it won, narrowing like the zone. */
:root {
  --bg: #ECEFF3;
  --surface: #FFFFFF;
  --sunk: #E1E5EB;
  --ink: #131821;
  --muted: #566073;
  --line: #D2D8E1;
  --gold: #8F5A00;
  --gold-fill: #D4901A;
  --gold-soft: #FAEED5;
  --storm: #4F3FBF;
  --storm-soft: #E9E6FF;
  --out: #A9341A;
  --out-soft: #FAE4DD;
  --ok: #1F6F4A;
  --ok-soft: #DDF1E6;
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --radius: 12px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1218; --surface: #161B24; --sunk: #222937; --ink: #E8ECF2; --muted: #9AA4B5; --line: #2A3242;
    --gold: #F2BC4B; --gold-fill: #E0A12C; --gold-soft: #2D2410; --storm: #A99CFF; --storm-soft: #211C3E;
    --out: #FF8A6B; --out-soft: #3A1D16; --ok: #6FD3A0; --ok-soft: #13301F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1218; --surface: #161B24; --sunk: #222937; --ink: #E8ECF2; --muted: #9AA4B5; --line: #2A3242;
  --gold: #F2BC4B; --gold-fill: #E0A12C; --gold-soft: #2D2410; --storm: #A99CFF; --storm-soft: #211C3E;
  --out: #FF8A6B; --out-soft: #3A1D16; --ok: #6FD3A0; --ok-soft: #13301F;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 400 15px/1.55 var(--body);
}
.page {
  max-width: 1080px;
  margin: 0 auto;
  padding-block: 36px 72px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid;
  gap: 56px;
}
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
ul, ol { margin: 0; padding: 0; list-style: none; }

/* Type scale */
.eyebrow, .label, .chip, .num, .hud-label, th {
  font-family: var(--mono);
  font-size: 11.5px;
  letter-spacing: .08em;
  text-transform: uppercase;
}
.eyebrow { color: var(--muted); }
.display { font-family: var(--display); font-weight: 900; text-transform: uppercase; line-height: .92; letter-spacing: .005em; }
.num { font-variant-numeric: tabular-nums; letter-spacing: 0; text-transform: none; font-size: 13px; font-weight: 500; }

/* Masthead */
.masthead { display: grid; gap: 18px; }
.masthead h1 { font-size: clamp(2.3rem, 6.4vw, 4.4rem); max-width: 18ch; }
.hud { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; }
.hud li { display: flex; align-items: center; gap: 8px; }
.hud li + li::before { content: "→"; color: var(--muted); font-family: var(--mono); }
.hud-stage {
  display: grid; gap: 2px; padding: 8px 14px 9px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
  min-width: 76px;
}
.hud-count { font-family: var(--display); font-weight: 900; font-size: 1.9rem; line-height: 1; font-variant-numeric: tabular-nums; }
.hud-label { color: var(--muted); font-size: 10.5px; }
.hud-stage.is-winner { border-color: var(--gold-fill); background: var(--gold-soft); }
.hud-stage.is-winner .hud-count { color: var(--gold); }
.hud-stage.is-storm .hud-label { color: var(--storm); }

/* The super idea */
.champion {
  background: var(--surface);
  border: 1px solid var(--line);
  border-top: 4px solid var(--gold-fill);
  border-radius: var(--radius);
  padding: clamp(20px, 4vw, 40px);
  display: grid;
  gap: 32px;
}
.champion-head { display: grid; gap: 12px; }
.champion-head .eyebrow { color: var(--gold); }
.champion-name { font-size: clamp(2.8rem, 9vw, 5.6rem); }
.one-liner { font-size: clamp(1.05rem, 2.2vw, 1.25rem); line-height: 1.5; max-width: 62ch; }
.champion-body { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 32px 48px; }
.stack { display: grid; gap: 22px; align-content: start; min-width: 0; }
.block { display: grid; gap: 8px; min-width: 0; }
.label { color: var(--muted); }
.how { counter-reset: how; display: grid; gap: 10px; }
.how li { counter-increment: how; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: baseline; }
.how li::before { content: counter(how); font-family: var(--display); font-weight: 900; font-size: 1.35rem; color: var(--gold); line-height: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 8px 4px; border-radius: 6px;
  background: var(--sunk); color: var(--ink);
  font-size: 10.5px; line-height: 1.3; white-space: nowrap;
}
.chip.loot { display: inline-block; background: var(--gold-soft); color: var(--gold); text-transform: none; letter-spacing: 0; font-size: 12.5px; white-space: normal; }
.chip.loot small { color: var(--muted); font-size: inherit; margin-left: 6px; }
.chip.gold { background: var(--gold-soft); color: var(--gold); }
.chip.out { background: var(--out-soft); color: var(--out); }
.chip.storm { background: var(--storm-soft); color: var(--storm); }
.chip.ok { background: var(--ok-soft); color: var(--ok); }

/* Score bars, drawn to one 0-10 scale */
.scores { display: grid; gap: 12px; }
.score-row { display: grid; grid-template-columns: 92px minmax(0, 1fr) 34px; gap: 12px; align-items: center; }
.score-row .label { font-size: 10.5px; }
.track { position: relative; height: 10px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
.fill { position: absolute; inset: 0 auto 0 0; border-radius: 99px; background: var(--muted); }
.score-row.is-super .fill { background: var(--gold-fill); }
.score-row.is-bar .fill { background: transparent; border: 1.5px dashed var(--muted); }
.score-row.is-super .num { color: var(--gold); font-weight: 600; }
.scale { display: grid; grid-template-columns: 92px minmax(0, 1fr) 34px; gap: 12px; }
.scale-ticks { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.score { display: inline-grid; grid-template-columns: 64px auto; gap: 8px; align-items: center; }
.score .track { height: 7px; }

.facts { display: grid; gap: 14px; padding-top: 18px; border-top: 1px solid var(--line); }
.fact { display: grid; gap: 4px; }
.fact .chip { justify-self: start; }

.moves { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding-top: 28px; border-top: 1px solid var(--line); }
.move { display: grid; gap: 6px; align-content: start; padding: 14px 16px 16px; background: var(--sunk); border-radius: 10px; min-width: 0; }
.move .label { color: var(--ink); font-weight: 500; }
.move:first-child { background: var(--gold-soft); }
.move:first-child .label { color: var(--gold); }

/* Sections of the fight log */
.section { display: grid; gap: 18px; min-width: 0; }
.section-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; padding-bottom: 10px; border-bottom: 2px solid var(--ink); }
.section-head h2 { font-size: clamp(1.7rem, 4vw, 2.3rem); }
.section-head .eyebrow { font-size: 11px; }
.log-title { display: grid; gap: 6px; }
.log-title h2 { font-size: clamp(2.2rem, 6vw, 3.4rem); }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 40px; }
.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }

dl.sheet { margin: 0; display: grid; grid-template-columns: 128px minmax(0, 1fr); }
dl.sheet dt, dl.sheet dd { margin: 0; padding: 11px 0; border-bottom: 1px solid var(--line); }
dl.sheet dt { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-right: 12px; padding-top: 13px; }
dl.sheet dd { display: grid; gap: 6px; min-width: 0; }
.chain { display: flex; flex-wrap: wrap; gap: 4px 6px; align-items: baseline; }
.chain span + span::before { content: "→ "; color: var(--muted); }
.assumed { color: var(--muted); font-style: italic; }

.rubric-bar { display: flex; height: 12px; border-radius: 99px; overflow: hidden; gap: 2px; background: var(--surface); }
.rubric-bar span { display: block; height: 100%; background: var(--ink); }
.rubric-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; }
.rubric-legend li { display: flex; align-items: center; gap: 6px; }
.rubric-legend i { width: 10px; height: 10px; border-radius: 3px; background: var(--ink); display: inline-block; }

/* Roster */
.roster { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 14px; }
.card {
  display: grid; gap: 12px; align-content: start;
  padding: 16px 18px 18px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--radius); min-width: 0;
}
.card.is-champion { border-color: var(--gold-fill); box-shadow: 0 0 0 1px var(--gold-fill) inset; }
.card-top { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.letter {
  width: 38px; height: 38px; display: grid; place-items: center;
  border-radius: 8px; background: var(--sunk);
  font-family: var(--display); font-weight: 900; font-size: 1.45rem; line-height: 1;
}
.card.is-champion .letter { background: var(--gold-soft); color: var(--gold); }
.card .archetype { color: var(--muted); }
.card h3 { font-size: 1.6rem; }
.card.is-out h3 { color: var(--muted); }
.card p { color: var(--ink); }
.bet { display: grid; gap: 6px; padding-top: 10px; border-top: 1px dashed var(--line); font-size: 14px; }
.bet-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.trail { display: flex; flex-wrap: wrap; gap: 4px 8px; font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.trail b { color: var(--ink); font-weight: 500; }
.trail span + span::before { content: "→ "; }

/* Tables */
.table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
table.wide { min-width: 720px; }
th { text-align: left; font-weight: 500; color: var(--muted); padding: 12px 14px; border-bottom: 1px solid var(--line); font-size: 10.5px; }
td { padding: 12px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
td.idea { font-weight: 600; white-space: nowrap; }
td.idea .letter-inline { font-family: var(--display); font-weight: 900; font-size: 1.1rem; color: var(--muted); margin-right: 8px; }
tr.is-out td { color: var(--muted); }
tr.is-out td.idea { text-decoration: line-through; text-decoration-color: var(--out); text-decoration-thickness: 1.5px; }
td.nowrap { white-space: nowrap; }

/* Kill feed */
.feed { display: grid; gap: 6px; }
.feed li {
  display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; align-items: baseline;
  padding: 9px 12px; border-radius: 8px; background: var(--out-soft);
}
.feed .who { font-weight: 600; }
.feed .why { color: var(--ink); }

/* Loot */
.loot-list { display: grid; gap: 10px; }
.loot-list li { display: grid; gap: 6px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.loot-line { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.loot-line .to { font-weight: 600; }
.v2 { color: var(--muted); }
.v2 b { color: var(--ink); font-weight: 600; }

/* Storm */
.storm-band { display: grid; gap: 16px; padding: clamp(18px, 3vw, 28px); border-radius: var(--radius); background: var(--storm-soft); }
.storm-band .eyebrow { color: var(--storm); }
.storm-scenario { font-size: clamp(1.6rem, 4.4vw, 2.5rem); color: var(--ink); max-width: 24ch; }
.storm-band .table-wrap { border-color: transparent; }

/* Duel */
.duel { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 16px; align-items: stretch; }
.vs { align-self: center; font-family: var(--display); font-weight: 900; font-size: 1.8rem; color: var(--muted); }
.corner { display: grid; gap: 14px; align-content: start; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.corner.is-champion { border-color: var(--gold-fill); box-shadow: 0 0 0 1px var(--gold-fill) inset; }
.corner-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.corner h3 { font-size: 1.7rem; }
.verdict-line { padding: 14px 16px; border-radius: 10px; background: var(--gold-soft); }
.verdict-line b { color: var(--gold); }

footer { color: var(--muted); font-family: var(--mono); font-size: 11.5px; letter-spacing: .04em; border-top: 1px solid var(--line); padding-top: 16px; }

a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--gold-fill); outline-offset: 2px; }

@media (max-width: 900px) {
  .roster { --cols: 2 !important; }
  .three { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 760px) {
  .champion-body, .two { grid-template-columns: minmax(0, 1fr); }
  .moves { grid-template-columns: minmax(0, 1fr); }
  .duel { grid-template-columns: minmax(0, 1fr); }
  .vs { justify-self: center; }
}
@media (max-width: 560px) {
  .page { gap: 44px; padding-block: 24px 56px; }
  .roster { --cols: 1 !important; }
  dl.sheet { grid-template-columns: minmax(0, 1fr); }
  dl.sheet dt { border-bottom: 0; padding-bottom: 0; }
  .score-row, .scale { grid-template-columns: 78px minmax(0, 1fr) 30px; gap: 10px; }
  .hud, .hud li { gap: 4px; }
  .hud-stage { min-width: 0; padding: 7px 9px 8px; }
  .hud-count { font-size: 1.6rem; }
  .hud-label { font-size: 9.5px; letter-spacing: .05em; }
}
@media (prefers-reduced-motion: no-preference) {
  .fill { animation: grow .7s cubic-bezier(.2, .7, .2, 1) both; transform-origin: left; }
  @keyframes grow { from { transform: scaleX(.001); } to { transform: scaleX(1); } }
}
</style>
</head>
<body>
<main class="page" id="app"></main>

    table([L.rank, L.idea, L.fighter, L.outIn, L.best], ranked.map(function (f, i) {
      var champ = f.out === null || f.out === undefined;
      return h("tr", { class: f.out && f.out !== "final" ? "is-out" : null },
        h("td", { class: "nowrap" }, champ ? h("span", { class: "chip gold" }, L.champion) : h("span", { class: "num" }, String(i + 1))),
        h("td", { class: "idea" }, h("span", { class: "letter-inline" }, f.id), f.idea),
        h("td", null, f.archetype),
        h("td", null, champ ? L.none : stageName(f.out)),
        h("td", { class: "nowrap" }, score(best(f))));
    }), true)));

  app.append(h("footer", null, L.footer));
})();
</script>
