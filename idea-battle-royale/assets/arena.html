<style>
:root{
  --bg:#f6f4ef;--surface:#ffffff;--surface-2:#efece4;--text:#1d1b18;--muted:#6b665d;--line:#ddd8cc;
  --accent:#d9480f;--accent-soft:#ffe8dc;--gold:#b7791f;--gold-soft:#fff3d6;--danger:#c92a2a;--ok:#2b8a3e;
  --bar:#4263eb;--bar-2:#a5b4fc;--shadow:0 6px 24px rgba(30,20,10,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121110;--surface:#1c1a18;--surface-2:#262320;--text:#f2efe9;--muted:#a39d92;--line:#36322d;
    --accent:#ff7a3d;--accent-soft:#3a2216;--gold:#f2b84b;--gold-soft:#3a2e14;--danger:#ff6b6b;--ok:#69db7c;
    --bar:#748ffc;--bar-2:#3b4a8c;--shadow:0 6px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#121110;--surface:#1c1a18;--surface-2:#262320;--text:#f2efe9;--muted:#a39d92;--line:#36322d;
  --accent:#ff7a3d;--accent-soft:#3a2216;--gold:#f2b84b;--gold-soft:#3a2e14;--danger:#ff6b6b;--ok:#69db7c;
  --bar:#748ffc;--bar-2:#3b4a8c;--shadow:0 6px 24px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
main{max-width:760px;margin:0 auto;padding:24px 16px 64px}
h1{font-size:1.6rem;line-height:1.2;margin:.2em 0 .1em}
h2{font-size:1.15rem;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.kicker{color:var(--accent);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:.75rem}
.muted{color:var(--muted)}
section{margin-top:28px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--surface-2);border-radius:999px;padding:3px 10px;font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.fighter{position:relative;overflow:hidden}
.fighter .emoji{font-size:1.8rem}
.fighter h3{margin:4px 0 2px;font-size:1rem}
.fighter .arch{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.fighter p{margin:6px 0 0;font-size:.9rem}
.stamp{position:absolute;top:16px;right:12px;transform:rotate(12deg) scale(2.5);opacity:0;border:3px solid var(--danger);color:var(--danger);
  font-weight:800;padding:2px 8px;border-radius:6px;letter-spacing:.08em;font-size:.8rem;background:var(--surface)}
.fighter.out{filter:grayscale(.8);opacity:.6}
.fighter.out .stamp{animation:stamp .45s cubic-bezier(.2,1.6,.4,1) forwards}
@keyframes stamp{to{opacity:1;transform:rotate(12deg) scale(1)}}
.attack{display:grid;gap:10px}
.attack .row{display:grid;gap:4px}
.attack .top{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.strike{color:var(--danger);font-size:.9rem}
.strike::before{content:"⚔️ "}
.rebut{font-size:.9rem;color:var(--muted)}
.rebut::before{content:"🛡️ "}
.track{height:10px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.fill{height:100%;width:0;background:var(--bar);border-radius:99px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.fill.loser{background:var(--danger);opacity:.55}
.fill.v2{background:var(--ok)}
.loot{display:flex;gap:10px;align-items:flex-start}
.loot .arrow{font-size:1.3rem}
.duel{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.duel .side{padding:14px 8px;border-radius:12px;background:var(--surface-2)}
.duel .side.win{background:var(--gold-soft);outline:2px solid var(--gold)}
.duel .big{font-size:1.6rem;font-weight:800}
.vs{font-weight:900;font-size:1.4rem;color:var(--accent)}
.super{border:2px solid var(--gold);background:linear-gradient(160deg,var(--gold-soft),var(--surface) 60%);position:relative;overflow:hidden}
.super h2{font-size:1.4rem}
.trophy{font-size:2.6rem;display:inline-block}
.reveal.in .trophy{animation:bounce 1s ease}
@keyframes bounce{0%{transform:scale(0) rotate(-20deg)}60%{transform:scale(1.25) rotate(8deg)}100%{transform:scale(1)}}
.scoreline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:8px 0}
.scoreline .big{font-size:2.4rem;font-weight:900;color:var(--gold)}
ol,ul{padding-left:20px;margin:6px 0}
li{margin:4px 0}
.crit{display:grid;grid-template-columns:110px 1fr 38px;gap:8px;align-items:center;font-size:.9rem;margin:6px 0}
.crit .tracks{display:grid;gap:3px}
.crit .fill.champ{background:var(--bar-2)}
.legend{display:flex;gap:14px;font-size:.8rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.pm{display:grid;gap:8px}
.pm .item{display:grid;grid-template-columns:1fr;gap:2px;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.pm .risk{color:var(--danger);font-weight:600}
.pm .safe{color:var(--ok)}
.moves{display:grid;gap:10px;counter-reset:m}
.move{display:flex;gap:12px;align-items:flex-start}
.move .n{flex:none;width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800}
.move b{display:block}
.rank .crit{grid-template-columns:minmax(90px,150px) 1fr 38px}
.actions{display:flex;justify-content:center;margin-top:32px}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:10px 18px;background:var(--accent);color:#fff;font-weight:700}
button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.reveal.in{opacity:1;transform:none}
.drop{opacity:0;transform:translateY(-40px) scale(.9)}
.reveal.in .drop{animation:drop .55s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes drop{to{opacity:1;transform:none}}

/* Loading screen */
#loader{position:fixed;inset:0;z-index:10;background:var(--bg);display:grid;place-items:center;padding:16px;transition:opacity .5s ease}
#loader.done{opacity:0;pointer-events:none}
.ld{text-align:center;max-width:340px;width:100%}
.clash{position:relative;height:110px;margin:0 auto 18px;width:200px}
.clash span{position:absolute;top:30px;font-size:2.6rem}
.clash .l{left:0;animation:lunge-l 1s ease-in-out infinite}
.clash .r{right:0;animation:lunge-r 1s ease-in-out infinite}
.clash .spark{left:50%;top:22px;transform:translateX(-50%) scale(0);font-size:2.2rem;animation:spark 1s ease-in-out infinite}
@keyframes lunge-l{0%,100%{transform:translateX(0)}45%{transform:translateX(62px) rotate(15deg)}}
@keyframes lunge-r{0%,100%{transform:translateX(0) scaleX(-1)}45%{transform:translateX(-62px) scaleX(-1) rotate(15deg)}}
@keyframes spark{0%,35%{transform:translateX(-50%) scale(0);opacity:0}48%{transform:translateX(-50%) scale(1.3);opacity:1}70%,100%{transform:translateX(-50%) scale(.2);opacity:0}}
.ld .phase{font-weight:700;min-height:1.5em}
.ld .bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;margin:14px 0 6px}
.ld .bar div{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:99px;transition:width .5s ease}
.ld .count{font-size:.8rem;color:var(--muted)}
.ld button{margin-top:18px}

.confetti{position:absolute;top:-10px;width:8px;height:12px;border-radius:2px;opacity:0;pointer-events:none}
.super.in .confetti{animation:fall 1.8s ease-in forwards}
@keyframes fall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(420px) rotate(540deg)}}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .reveal,.drop{opacity:1;transform:none}
  .fighter.out .stamp{opacity:1;transform:rotate(12deg)}
}
@media (max-width:480px){
  h1{font-size:1.35rem}
  .crit{grid-template-columns:84px 1fr 34px}
  .duel .big{font-size:1.3rem}
}
</style>
</head>
<body>
<div id="loader" role="status" aria-live="polite">
  <div class="ld">
    <div class="clash" aria-hidden="true"><span class="l">🤺</span><span class="spark">💥</span><span class="r">🤺</span></div>
    <div class="phase" id="ld-phase"></div>
    <div class="bar"><div id="ld-bar"></div></div>
    <div class="count" id="ld-count"></div>
    <button class="ghost" id="skip"></button>
  </div>
</div>
<main id="app"></main>
<script>
(function(){
  var LABELS = {
    en: {loading:["Fighters entering the arena…","Pitching ideas…","Red team attacking…","Eliminations…","Looting the fallen…","Final duel…","Forging the super idea…"],
      skip:"Skip", colon:": ", q:["“","”"], step:"Phase", arena:"The Arena", problem:"Problem", constraints:"Constraints", rubric:"Rubric",
      drop:"The Drop", fighters:"fighters", attack:"Round 1 — The Attack", out:"OUT", eliminated:"Eliminated",
      looting:"The Looting", grabs:"grabs", from:"from", duel:"The Final Duel", champion:"Champion",
      superIdea:"The Super Idea", how:"How it works", why:"Why it won", final:"Final score", vsChamp:"champion alone",
      byCrit:"Score by criterion", superLbl:"Super idea", champLbl:"Champion", premortem:"Pre-mortem — how it could fail",
      moves:"Your first 3 moves", runner:"Runner-up worth remembering", ranking:"Final ranking", replay:"Replay the battle"},
    fr: {loading:["Les combattants entrent dans l'arène…","Chacun présente son idée…","Le red team attaque…","Éliminations…","Pillage des vaincus…","Duel final…","Fusion de la super idée…"],
      skip:"Passer", colon:" : ", q:["« "," »"], step:"Phase", arena:"L'arène", problem:"Problème", constraints:"Contraintes", rubric:"Grille de notation",
      drop:"Le drop", fighters:"combattants", attack:"Round 1 — L'attaque", out:"ÉLIMINÉ", eliminated:"Éliminés",
      looting:"Le pillage", grabs:"récupère", from:"de", duel:"Le duel final", champion:"Champion",
      superIdea:"La super idée", how:"Comment ça marche", why:"Pourquoi elle a gagné", final:"Score final", vsChamp:"champion seul",
      byCrit:"Score par critère", superLbl:"Super idée", champLbl:"Champion", premortem:"Pré-mortem — comment ça pourrait rater",
      moves:"Tes 3 premiers coups", runner:"Finaliste à retenir", ranking:"Classement final", replay:"Rejouer le combat"}
  };
  var D = {};
  try { D = JSON.parse(document.getElementById('battle-data').textContent); } catch (e) { D = {title:"Battle data could not be read"}; }
  var lang = String(D.lang || document.documentElement.lang || 'en').slice(0,2).toLowerCase();
  var L = LABELS[lang] || LABELS.en;
  document.documentElement.lang = lang;
  if (D.title) document.title = D.title;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  function el(tag, cls, text){ var n=document.createElement(tag); if(cls) n.className=cls; if(text!=null&&text!=='') n.textContent=text; return n; }
  function add(p){ for(var i=1;i<arguments.length;i++){ if(arguments[i]) p.appendChild(arguments[i]); } return p; }
  function num(v){ v=Number(v); return isFinite(v)?v:0; }
  function fmt(v){ return (Math.round(num(v)*10)/10).toString().replace('.', lang==='fr'?',':'.'); }
  function bar(value, max, cls){ var t=el('div','track'), f=el('div','fill'+(cls?' '+cls:'')); f.dataset.w=Math.max(0,Math.min(100,num(value)/max*100)); t.appendChild(f); return t; }
  function section(icon, title){ var s=el('section','reveal'); s.appendChild(el('h2',null,icon+' '+title)); return s; }
  function list(tag, items){ var o=el(tag); (items||[]).forEach(function(t){ o.appendChild(el('li',null,t)); }); return o; }

  var app = document.getElementById('app');
  var fighters = D.fighters || [];

  // Header
  var head = el('header','reveal');
  add(head, el('div','kicker','⚔️ Idea Battle Royale'), el('h1',null,D.title||''));
  app.appendChild(head);

  // Arena
  var s = section('🏟️', L.arena), c = el('div','card');
  add(c, el('div',null,null));
  c.firstChild.appendChild(el('b',null,L.problem+L.colon)); c.firstChild.appendChild(document.createTextNode(D.problem||''));
  if ((D.constraints||[]).length){ var ch=el('div','chips'); D.constraints.forEach(function(t){ ch.appendChild(el('span','chip',t)); }); add(c, el('div','muted',L.constraints), ch); }
  if ((D.rubric||[]).length){ var rb=el('div','chips'); D.rubric.forEach(function(r){ rb.appendChild(el('span','chip',r.name+' · '+r.weight+'%')); }); var rl=el('div','muted',L.rubric); rl.style.marginTop='10px'; add(c, rl, rb); }
  app.appendChild(add(s,c));

  // Drop
  s = section('🪂', L.drop+' — '+fighters.length+' '+L.fighters);
  var g = el('div','grid');
  fighters.forEach(function(f,i){
    var k = el('div','card fighter drop'+(f.eliminated?' will-out':''));
    k.style.animationDelay=(i*0.12)+'s';
    add(k, el('div','emoji',f.emoji||'🥊'), el('div','arch',f.archetype), el('h3',null,f.idea), el('p',null,f.pitch), el('div','stamp',L.out));
    g.appendChild(k);
  });
  app.appendChild(add(s,g));

  // Attack
  s = section('⚔️', L.attack);
  c = el('div','card attack');
  fighters.forEach(function(f){
    var r = el('div','row');
    var top = el('div','top'); add(top, el('span',null,(f.emoji||'🥊')+' '+f.idea), el('span',null,fmt(f.score)+'/10'));
    add(r, top, f.strike?el('div','strike',f.strike):null, f.rebuttal?el('div','rebut',f.rebuttal):null, bar(f.score,10,f.eliminated?'loser':''));
    c.appendChild(r);
  });
  var outs = fighters.filter(function(f){return f.eliminated;});
  if (outs.length){ var ul=el('ul'); outs.forEach(function(f){ var li=el('li'); add(li, el('b',null,'❌ '+f.idea)); if(f.lossReason) li.appendChild(document.createTextNode(' — '+f.lossReason)); ul.appendChild(li); }); add(c, el('b',null,L.eliminated), ul); }
  app.appendChild(add(s,c));

  // Looting
  if ((D.looting||[]).length){
    s = section('💰', L.looting); c = el('div','card');
    D.looting.forEach(function(l,i){
      var row = el('div','loot'); if(i) row.style.marginTop='10px';
      var txt = el('div'); add(txt, el('b',null,l.to+' '+L.grabs+' '+L.q[0]+l.loot+L.q[1]+' '+L.from+' '+l.from), l.result?el('div','muted',l.result):null);
      add(row, el('span','arrow','🎒'), txt); c.appendChild(row);
    });
    app.appendChild(add(s,c));
  }

  // Duel
  if (D.duel){
    var du=D.duel; s = section('🥊', L.duel); c = el('div','card');
    var d = el('div','duel');
    function side(name, sc){ var x=el('div','side'+(name===du.champion?' win':'')); add(x, el('div',null,(name===du.champion?'🏆 ':'')+name), el('div','big',fmt(sc))); return x; }
    add(d, side(du.a,du.scoreA), el('div','vs','VS'), side(du.b,du.scoreB));
    add(c, d); if (du.reason){ var rp=el('p',null,null); add(rp, el('b',null,L.champion+L.colon+du.champion+'. ')); rp.appendChild(document.createTextNode(du.reason)); c.appendChild(rp); }
    app.appendChild(add(s,c));
  }

  // Super idea
  var S = D.superIdea || {};
  s = el('section','card super reveal');
  add(s, el('div','trophy','🏆'), el('div','kicker',L.superIdea), el('h2',null,S.name||''), el('p',null,S.oneLiner||''));
  var sl = el('div','scoreline'); add(sl, el('span','big',fmt(S.score)+'/10'), el('span','muted',L.final+(S.championScore!=null?' · '+L.vsChamp+' '+fmt(S.championScore):'')));
  s.appendChild(sl);
  if ((S.howItWorks||[]).length) add(s, el('b',null,L.how), list('ol',S.howItWorks));
  if (S.whyWon){ var w=el('p'); add(w, el('b',null,L.why+L.colon)); w.appendChild(document.createTextNode(S.whyWon)); s.appendChild(w); }
  for (var i=0;i<26;i++){ var cf=el('span','confetti'); cf.style.left=(Math.random()*100)+'%'; cf.style.background=['var(--gold)','var(--accent)','var(--bar)','var(--ok)'][i%4]; cf.style.animationDelay=(Math.random()*0.6)+'s'; s.appendChild(cf); }
  app.appendChild(s);

  // Criteria chart
  if ((S.scores||[]).length){
    s = section('📊', L.byCrit); c = el('div','card');
    S.scores.forEach(function(r){
      var row=el('div','crit'), tr=el('div','tracks');
      add(tr, bar(r.value,10,'v2'), r.champion!=null?bar(r.champion,10,'champ'):null);
      add(row, el('span',null,r.name), tr, el('b',null,fmt(r.value))); c.appendChild(row);
    });
    var lg=el('div','legend'); var a=el('span'); a.innerHTML='<i style="background:var(--ok)"></i>'; a.appendChild(document.createTextNode(L.superLbl));
    var b=el('span'); b.innerHTML='<i style="background:var(--bar-2)"></i>'; b.appendChild(document.createTextNode(L.champLbl)); add(lg,a,b); c.appendChild(lg);
    app.appendChild(add(s,c));
  }

  // Ranking
  s = section('🏅', L.ranking); c = el('div','card rank');
  fighters.slice().sort(function(x,y){ return num(y.scoreV2!=null?y.scoreV2:y.score)-num(x.scoreV2!=null?x.scoreV2:x.score); }).forEach(function(f){
    var v=f.scoreV2!=null?f.scoreV2:f.score, row=el('div','crit');
    add(row, el('span',null,(f.emoji||'🥊')+' '+f.idea), bar(v,10,f.eliminated?'loser':(f.scoreV2!=null?'v2':'')), el('b',null,fmt(v))); c.appendChild(row);
  });
  app.appendChild(add(s,c));

  // Pre-mortem
  if ((S.premortem||[]).length){
    s = section('🧯', L.premortem); c = el('div','pm');
    S.premortem.forEach(function(p){ var it=el('div','item'); add(it, el('span','risk','⚠️ '+p.risk), el('span','safe','✅ '+p.safeguard)); c.appendChild(it); });
    app.appendChild(add(s,c));
  }

  // First moves
  if ((S.firstMoves||[]).length){
    s = section('🎯', L.moves); c = el('div','card moves');
    S.firstMoves.forEach(function(m,i){ var mv=el('div','move'), t=el('div'); add(t, el('b',null,m.when), el('span',null,m.what)); add(mv, el('span','n',String(i+1)), t); c.appendChild(mv); });
    app.appendChild(add(s,c));
  }

  // Runner-up
  if (D.runnerUp && D.runnerUp.name){
    s = section('🥈', L.runner); c = el('div','card');
    add(c, el('b',null,D.runnerUp.name), D.runnerUp.when?el('div','muted',D.runnerUp.when):null);
    app.appendChild(add(s,c));
  }

  var act = el('div','actions'), rb2 = el('button',null,'🔁 '+L.replay); act.appendChild(rb2); app.appendChild(act);

  // Reveal on scroll
  function show(n){
    if (n.classList.contains('in')) return;
    n.classList.add('in');
    n.querySelectorAll('.fill').forEach(function(f){ f.style.width=f.dataset.w+'%'; });
    n.querySelectorAll('.will-out').forEach(function(f,i){ setTimeout(function(){ f.classList.add('out'); }, reduce?0:900+i*250); });
  }
  var nodes = Array.prototype.slice.call(document.querySelectorAll('.reveal'));
  var io = ('IntersectionObserver' in window) ? new IntersectionObserver(function(es){ es.forEach(function(e){ if(e.isIntersecting){ show(e.target); io.unobserve(e.target); } }); },{threshold:.15}) : null;
  function startReveal(){ nodes.forEach(function(n){ if(io) io.observe(n); else show(n); }); setTimeout(function(){ nodes.forEach(show); }, 8000); }

  // Loading screen
  var loader=document.getElementById('loader'), ph=document.getElementById('ld-phase'), lb=document.getElementById('ld-bar'), lc=document.getElementById('ld-count'), skip=document.getElementById('skip');
  skip.textContent=L.skip;
  var step=0, timer=null;
  function finish(){ clearInterval(timer); loader.classList.add('done'); window.scrollTo(0,0); startReveal(); }
  function tick(){
    if (step>=L.loading.length){ finish(); return; }
    ph.textContent=L.loading[step]; lb.style.width=((step+1)/L.loading.length*100)+'%';
    lc.textContent=L.step+' '+(step+1)+' / '+L.loading.length; step++;
  }
  function play(){
    nodes.forEach(function(n){ n.classList.remove('in'); n.querySelectorAll('.fill').forEach(function(f){ f.style.width='0'; }); n.querySelectorAll('.out').forEach(function(f){ f.classList.remove('out'); }); });
    if (io) nodes.forEach(function(n){ io.unobserve(n); });
    step=0; loader.classList.remove('done');
    if (reduce){ finish(); return; }
    tick(); timer=setInterval(tick, 650);
  }
  skip.addEventListener('click', finish);
  loader.addEventListener('click', function(e){ if(e.target===loader) finish(); });
  rb2.addEventListener('click', play);
  play();
})();
</script>
</body>
</html>
